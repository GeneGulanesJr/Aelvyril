name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only checks out code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # `node --test src/` (a folder) needs 26; on 24 it is read as a file
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
