# Aelvyril — agent memory & asset platform (server)
# Deployed via TrueNAS Custom App (Compose from this repo).
services:
  aelvyril-server:
    image: node:24-bookworm-slim
    container_name: aelvyril-server
    restart: unless-stopped
    command: ["bash", "-c", "if [ -f /data/setup/setup-aelvyril.sh ]; then bash /data/setup/setup-aelvyril.sh; else apt-get update && apt-get install -y --no-install-recommends openssh-server ca-certificates curl && mkdir -p /run/sshd && /usr/sbin/sshd; fi; tail -f /dev/null"]
    ports:
      - "2322:22"
      - "8420:8420"
    volumes:
      - /mnt/MasterDisk/aelvyril:/data
    working_dir: /data
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  aelvyril-sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: aelvyril-sqld
    restart: unless-stopped
    ports:
      - "8480:8080"
    volumes:
      - /mnt/MasterDisk/aelvyril/sqld:/var/lib/sqld
    environment:
      SQLD_NODE_ID: "1"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
