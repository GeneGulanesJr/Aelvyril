# Spec §4/§5/§9: Aelvyril stack topology.
#
# Four services on one network (aelvyril-net). Only caddy publishes public
# ports (80/443). web (3000) + gateway (8787) are published LOOPBACK-ONLY
# for the dev profile + smoke script (#79) — plaintext HTTP never leaves
# the host; browsers reach web + gateway through Caddy TLS in prod.
# LaPis is NOT a service: src/mcp/server.js is stdio-MCP only (no HTTP,
# no lockfile) — it runs in-process inside the gateway as a pi extension
# (LAPIS_HOME=/data/lapis on the gateway-data volume).
# Two profiles:
#   dev   — bind-mounts apps/* for hot reload; uses local builds
#   prod  — uses prebuilt images; no source mounts
#
# Sibling-checkout layout (per spec §5): clone Aelvyril alongside
# ../LaPis, ../PiSandboxed, ../DecisionMCP (ex-LayaMCP, renamed 2026-10-05).
# Build contexts are relative to THIS FILE's directory (infra/), so each
# sibling context climbs two levels: ../../<Repo>. Prebuilt images replace
# these later.

name: aelvyril

services:
  caddy:
    # Spec §11: TLS termination. Auto-provisions Let's Encrypt certs.
    # Only the caddy service publishes public ports (80/443); web stays
    # internal so browsers can only reach it via TLS through this proxy.
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      AELVYRIL_DOMAIN: ${AELVYRIL_DOMAIN:-localhost}
      # #79: Clerk Frontend-API origins added to the CSP's script-src +
      # connect-src (space-separated; include both the https:// and wss://
      # spellings Clerk needs, e.g. "https://clerk.acmeinc.com
      # wss://clerk.acmeinc.com"). Empty = self-only CSP, which blocks
      # Clerk sign-in — set this in prod from your Clerk dashboard
      # (API Keys → Frontend API).
      CSP_CLERK_ORIGINS: ${CSP_CLERK_ORIGINS:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    profiles: [prod]

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
      # NEXT_PUBLIC_* is inlined into the client bundle at BUILD time.
      # Unset -> http://localhost:8787 (dev profile: browser on the host
      # hits the loopback-published gateway). Set-but-EMPTY (prod: set the
      # var to nothing in .env) -> same-origin /v1/* via the Caddy route —
      # the gateway stays internal-only and no CORS is involved (#79).
      # Note `-${...}` (not `:-`): an explicitly empty value must survive.
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL-http://localhost:8787}
        # The publishable key is inlined into the client bundle at BUILD
        # time — the runtime env below only affects SSR. Without this arg
        # the browser bundle bakes `undefined` and Clerk sign-in dead-ends.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY-}
        # Build-time auth switch: 1 = no Clerk sign-in, fixed dev identity.
        NEXT_PUBLIC_AUTH_DISABLED: ${NEXT_PUBLIC_AUTH_DISABLED-}
    restart: unless-stopped
    # #79: loopback-only. The compose comment used to promise "web only
    # reachable via Caddy TLS" while publishing plaintext HTTP on every
    # interface. 127.0.0.1 keeps the smoke + a local browser working; in
    # prod the public path is Caddy. To remove the mapping entirely:
    #   docker compose -f infra/compose.yaml -f infra/compose.hardened.yaml
    # (override file with `ports: !override []` under web + gateway).
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:3000:3000"
    environment:
      # Runtime value only (SSR); the client bundle took the build args.
      # Clerk keys are OPTIONAL in local dev: NEXT_PUBLIC_AUTH_DISABLED=1
      # swaps sign-in for a fixed dev identity (see apps/web/lib/auth.ts).
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL-http://localhost:8787}
      NEXT_PUBLIC_AUTH_DISABLED: ${NEXT_PUBLIC_AUTH_DISABLED-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${WEB_CLERK_SECRET_KEY:-}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      # Next.js compiles on first request; check that the port is listening
      # rather than waiting for a non-existent ready endpoint.
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    profiles: [dev, prod]

  gateway:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.gateway
    restart: unless-stopped
    expose:
      - "8787"  # container-to-container (web, caddy /v1/* route)
    # #79: loopback-only host publication. The smoke script polls
    # /healthz from the host and the dev-profile browser prompts
    # http://localhost:8787 directly. In prod the browser path is Caddy
    # (same-origin /v1/*) — this binding never leaves the host. Never
    # point GATEWAY_BIND_HOST at a public interface: /metrics is
    # unauthenticated unless GATEWAY_METRICS_SECRET is set.
    ports:
      - "${GATEWAY_BIND_HOST:-127.0.0.1}:8787:8787"
    environment:
      GATEWAY_PORT: "8787"
      GATEWAY_HOST: "::"
      GATEWAY_DB: /data/gateway.db
      GATEWAY_IDLE_MS: "300000"
      GATEWAY_ALLOWED_ORIGIN: ${GATEWAY_ALLOWED_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      GATEWAY_WORKSPACE_ALLOWLIST: ${GATEWAY_WORKSPACE_ALLOWLIST:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      # Local dev (see infra/.env): PI_FAKE=1 swaps both the auth verifier
      # (any bearer; token becomes the userId) and the pi child (fake-pi).
      # The #78 guard refuses non-loopback binds unless the container ack is
      # set — inside Docker the published ports are loopback-only (#79), so
      # the in-container :: bind never leaves the host.
      PI_FAKE: ${PI_FAKE:-}
      PI_FAKE_ALLOW_NON_LOOPBACK: ${PI_FAKE_ALLOW_NON_LOOPBACK:-}
      # In-process LaPis extension storage (LaPis is NOT a compose service —
      # it is stdio-MCP only and runs inside the gateway's pi runtime).
      LAPIS_HOME: /data/lapis
      # Decision engine (DecisionMCP, service key kept as "layamcp" for
      # compat) — used by the gateway health probe and the baked pi bundle's
      # decisionmcp MCP server config.
      LAYAMCP_URL: http://layamcp:8765
      # Spec §14: always pass --provider/--model explicitly
      PI_PROVIDER: ${PI_PROVIDER:-google}
      PI_MODEL: ${PI_MODEL:-gemini-2.0-flash}
      # Real LLM provider keys flow to children at spawn time
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - gateway-data:/data
      - pi-sessions:/sessions
      - ${WORKSPACES_HOST_PATH:-./workspaces}:/workspaces:ro
    # NOTE: no depends_on sandd — sandd is prod-profile only (needs /dev/kvm,
    # absent on most dev hosts incl. macOS) and compose errors when a
    # depends_on target isn't enabled by the active profile. The gateway
    # treats sandd as optional (its /healthz skips probes for unset *_URL).
    depends_on:
      layamcp:
        condition: service_healthy
    healthcheck:
      # node:22-slim ships no wget/curl — probe with node itself.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8787/healthz', r => process.exit(r.statusCode && r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    profiles: [dev, prod]

  sandd:
    # Spec §9: TypeScript/fastify daemon (NOT Rust — the 2026-09-22 research
    # predated the TS rewrite; see ../PiSandboxed/infra/docker/Dockerfile.sandd).
    # /dev/kvm device + host networking require a Linux host; on macOS the
    # kvm device doesn't exist, so sandd is prod-profile only.
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.sandd
      additional_contexts:
        - sandd_src=../../PiSandboxed
    restart: unless-stopped
    devices:
      - /dev/kvm:/dev/kvm
    cap_add:
      - SYS_ADMIN
    volumes:
      - sandbox-images:/images
      - sandd-token:/token:ro
    environment:
      SANDD_PORT: "7391"
      SMOLVM_BIN: /usr/local/bin/smolvm
      SMOLVM_IMAGES_DIR: /images
    # Sandd binds hardcoded 127.0.0.1 (src/server/main.ts) — no SANDD_HOST
    # upstream yet — so it must share the host network namespace. The
    # gateway reaches it at 127.0.0.1:7391 on the same host.
    network_mode: host
    profiles: [prod]

  layamcp:
    # Spec §9: CPU-only torch, ~4GB RAM, port 8765, /health endpoint.
    # Sibling repo renamed LayaMCP -> DecisionMCP (2026-10-05, v0.2.0);
    # service key + LAYAMCP_URL stay "layamcp" for compat. /health fix was
    # upstream Phase 4 work (commit e08ced4).
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.layamcp
      additional_contexts:
        - decisionmcp_src=../../DecisionMCP
    restart: unless-stopped
    expose:
      - "8765"
    volumes:
      - hf-models:/root/.cache/huggingface
    healthcheck:
      # Models load at module import; if /health answered, they're resident.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s  # model load + warmup is slow on first boot
    profiles: [dev, prod]

networks:
  default:
    name: aelvyril-net
    driver: bridge

volumes:
  gateway-data:
  pi-sessions:
  sandbox-images:
  hf-models:
  sandd-token:
    # Pre-seeded by operator: `docker run --rm -v sandd-token:/out alpine \
    #   sh -c "echo TOKEN > /out/token && chmod 0600 /out/token"`
    external: false
  caddy-data:
  caddy-config:
